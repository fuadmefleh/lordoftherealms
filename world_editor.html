<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>World Editor — Lord of the Realms</title>
<!-- Shared editor design system (foundation) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Inter:wght@300;400;500;600;700&family=MedievalSharp&display=swap" rel="stylesheet">
<link rel="stylesheet" href="editor-ui.css">
<script src="editor-ui.js"></script>
<script src="editor-core.js"></script>
<script src="world-editor-tools.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
/* Design tokens live in the shared editor-ui.css (:root:root). */
body{background:var(--bg);color:var(--text);font-family:Inter,-apple-system,'Segoe UI',sans-serif;font-size:12px;height:100vh;display:flex;flex-direction:column;overflow:hidden;user-select:none}
button{background:#1a2131;border:1px solid var(--border2);color:var(--text);padding:4px 9px;border-radius:5px;cursor:pointer;font-size:12px;transition:background .12s,border-color .12s;white-space:nowrap}
button:hover{background:#242c3f;border-color:var(--gold)}
button:disabled{opacity:.4;cursor:default}
button.active{background:var(--accent-bg);border-color:var(--gold);color:var(--gold)}
button.gold{background:var(--gold-bg);border-color:var(--gold);color:var(--gold)}
button.danger{background:var(--red-bg);border-color:var(--red);color:var(--red)}
button.icon{padding:4px 7px;min-width:28px}
input[type="number"],input[type="text"],select{background:#070b13;border:1px solid var(--border2);color:var(--text);padding:3px 6px;border-radius:4px;font-size:12px;font-family:inherit}
input[type="number"]{width:56px}
input[type="range"]{accent-color:var(--gold);width:90px;vertical-align:middle}
input[type="color"]{width:26px;height:22px;border:1px solid var(--border2);background:none;border-radius:4px;padding:0;cursor:pointer}
input[type="checkbox"]{accent-color:var(--gold)}
::-webkit-scrollbar{width:7px;height:7px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

/* ── Toolbar ── */
#toolbar{display:flex;align-items:center;gap:6px;padding:5px 10px;background:var(--panel);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}
#toolbar h1{font-family:Cinzel,serif;font-size:14px;font-weight:700;color:var(--gold);margin-right:4px;white-space:nowrap;letter-spacing:.04em}
.tb-sep{width:1px;height:22px;background:var(--border2);margin:0 2px}
.tb-group{display:flex;align-items:center;gap:3px}
.tb-lbl{font-size:10px;color:var(--text-dim);white-space:nowrap;text-transform:uppercase;letter-spacing:.06em;margin-right:2px}
.tb-val{font-size:11px;color:var(--gold);font-family:monospace;min-width:22px;text-align:center}
.menu{position:relative}
.menu-pop{position:absolute;top:calc(100% + 4px);left:0;background:var(--panel2);border:1px solid var(--border2);border-radius:6px;padding:4px;display:none;z-index:50;min-width:210px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.menu.open .menu-pop{display:block}
.menu-pop button{display:flex;width:100%;text-align:left;border:none;background:none;padding:6px 10px;justify-content:space-between;gap:16px}
.menu-pop button:hover{background:var(--hover);color:var(--gold)}
.menu-pop hr{border:none;border-top:1px solid var(--border);margin:4px 0}
.kbd{font-family:monospace;font-size:10px;color:var(--text-dim)}

/* ── Main layout ── */
#main{display:flex;flex:1;overflow:hidden}
#palette{width:228px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.palette-tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0}
.pal-tab{flex:1;padding:8px 2px;font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.02em;color:var(--text-dim);background:transparent;border:none;border-bottom:2px solid transparent;border-radius:0}
.pal-tab:hover{color:var(--text);background:var(--hover);border-color:transparent;border-bottom-color:transparent}
.pal-tab.active{color:var(--gold);border-bottom-color:var(--gold)}
.pal-body{flex:1;overflow-y:auto;padding:6px;display:none}
.pal-body.show{display:block}
.pal-search{width:100%;margin-bottom:6px}
.pal-cat{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-dim);padding:8px 6px 3px}
.pal-item{display:flex;align-items:center;gap:7px;padding:4px 6px;border-radius:5px;cursor:pointer;margin-bottom:1px;border:1px solid transparent}
.pal-item:hover{background:var(--hover)}
.pal-item.active{background:var(--accent-bg);border-color:var(--gold)}
.pal-swatch{width:26px;height:26px;border-radius:4px;flex-shrink:0;border:1px solid rgba(255,255,255,.1);background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;font-size:15px}
.pal-swatch img{width:26px;height:26px;object-fit:cover;border-radius:3px}
.pal-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pal-note{font-size:10px;color:var(--text-dim)}
.recent{display:flex;gap:4px;flex-wrap:wrap;padding:0 2px 4px}
.recent span{width:22px;height:22px;border-radius:4px;border:1px solid var(--border2);background-size:cover;cursor:pointer}
.recent span:hover{border-color:var(--gold)}
.realm-row{display:flex;align-items:center;gap:6px;padding:5px 6px;border-radius:5px;cursor:pointer;border:1px solid transparent;margin-bottom:2px}
.realm-row:hover{background:var(--hover)}
.realm-row.active{background:var(--accent-bg);border-color:var(--gold)}
.realm-dot{width:14px;height:14px;border-radius:3px;flex-shrink:0;border:1px solid rgba(255,255,255,.25)}
.realm-meta{font-size:10px;color:var(--text-dim)}
.pal-hint{font-size:11px;color:var(--text-dim);line-height:1.45;padding:6px;border:1px dashed var(--border);border-radius:6px;margin:6px 0}
.seg{display:flex;gap:0;margin:4px 0 8px}
.seg button{flex:1;border-radius:0}
.seg button:first-child{border-radius:5px 0 0 5px}
.seg button:last-child{border-radius:0 5px 5px 0}

/* ── Canvas ── */
#canvas-area{flex:1;position:relative;overflow:hidden;background:#05080d}
#canvas-area canvas{position:absolute;left:0;top:0}
#fx-canvas{cursor:crosshair}
#canvas-area.panning #fx-canvas{cursor:grabbing}
#canvas-area.space #fx-canvas{cursor:grab}
#drop-hint{position:absolute;inset:12px;border:2px dashed var(--gold);border-radius:12px;display:none;align-items:center;justify-content:center;font-family:Cinzel,serif;font-size:20px;color:var(--gold);background:rgba(5,8,13,.7);pointer-events:none}
#canvas-area.dropping #drop-hint{display:flex}

/* ── Right: Properties ── */
#props{width:250px;flex-shrink:0;background:var(--panel);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto}
.sec{border-bottom:1px solid var(--border);padding:8px 12px}
.sec h3{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-dim);margin-bottom:6px;display:flex;align-items:center;justify-content:space-between;cursor:pointer}
.sec h3 .badge{font-size:10px;padding:0 6px;border-radius:8px;background:var(--hover);color:var(--text-dim);letter-spacing:0}
.sec h3 .badge.err{background:var(--red-bg);color:var(--red)}
.sec h3 .badge.warn{background:var(--gold-bg);color:var(--gold)}
.sec.collapsed > :not(h3){display:none}
.row{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.row label{color:var(--text-dim);min-width:58px;font-size:11px}
.row input[type="text"],.row select{flex:1;min-width:0}
.row span{flex:1;font-size:11px;overflow:hidden;text-overflow:ellipsis}
.issue{display:flex;gap:6px;padding:4px 5px;border-radius:4px;font-size:11px;line-height:1.35;cursor:default}
.issue.jump{cursor:pointer}
.issue.jump:hover{background:var(--hover)}
.issue i{font-style:normal;flex-shrink:0}
.issue.error{color:#ff8a80}.issue.warn{color:var(--gold-light)}.issue.info{color:var(--text-dim)}
#stats-content{font-size:11px;color:var(--text-dim)}
.bar{height:6px;border-radius:3px;background:var(--hover);overflow:hidden;display:flex;margin:4px 0 6px}
.bar span{display:block;height:100%}
#minimap-canvas{width:100%;border:1px solid var(--border2);border-radius:3px;image-rendering:pixelated;cursor:pointer;display:block}

/* ── Status bar ── */
#statusbar{display:flex;gap:14px;align-items:center;padding:3px 10px;background:var(--panel);border-top:1px solid var(--border);font-size:11px;color:var(--text-dim);flex-shrink:0;white-space:nowrap;overflow:hidden}
#statusbar b{color:var(--text);font-weight:500}
#status-hint{flex:1;overflow:hidden;text-overflow:ellipsis}

/* ── Dialog bodies ── */
/* The generator needs more room than the stock 460px dialog */
.eui-modal-box:has(.gen-grid){max-width:820px;max-height:calc(100vh - 32px);overflow-y:auto}
.gen-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,360px);gap:16px}
.gen-grid > div{min-width:0}
.gen-grid .row label{min-width:86px}
.gen-grid input[type="range"]{flex:1;min-width:0}
.gen-grid .row[hidden]{display:none}
#gen-preview{display:block;width:100%;height:auto;aspect-ratio:36/25;border:1px solid var(--border2);border-radius:4px;image-rendering:pixelated;background:#05080d}
@media (max-width:700px){.gen-grid{grid-template-columns:minmax(0,1fr)}.gen-grid > div:last-child{order:-1}}
.help-grid{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:12px;min-width:420px}
.help-grid kbd{font-family:monospace;background:var(--hover);border:1px solid var(--border2);border-radius:3px;padding:0 5px;color:var(--gold);white-space:nowrap}
</style>
</head>
<body>

<div id="toolbar">
  <h1>World Editor</h1>
  <div class="menu" id="file-menu">
    <button onclick="toggleMenu('file-menu')">📁 File ▾</button>
    <div class="menu-pop">
      <button onclick="newMapDialog()">New map… <span class="kbd"></span></button>
      <button onclick="importJson()">Import .json… <span class="kbd"></span></button>
      <button onclick="exportJson()">Export .json <span class="kbd">Ctrl+S</span></button>
      <button onclick="exportPng()">Export picture (.png)</button>
      <hr>
      <button onclick="restoreAutosave(true)">Restore autosave</button>
      <hr>
      <button onclick="clearAllOverlays()">Clear places, roads &amp; rivers</button>
      <button onclick="clearMap()" style="color:var(--red)">Clear everything</button>
    </div>
  </div>
  <div class="tb-sep"></div>
  <div class="tb-group">
    <button class="icon" id="btn-undo" onclick="undo()" title="Undo (Ctrl+Z)">↶</button>
    <button class="icon" id="btn-redo" onclick="redo()" title="Redo (Ctrl+Y)">↷</button>
  </div>
  <div class="tb-sep"></div>
  <div class="tb-group" id="tool-group">
    <button class="icon active" id="tool-paint" onclick="setTool('paint')" title="Brush (B)">🖌</button>
    <button class="icon" id="tool-fill" onclick="setTool('fill')" title="Fill a connected area (G)">🧺</button>
    <button class="icon" id="tool-rect" onclick="setTool('rect')" title="Rectangle — drag (R)">▭</button>
    <button class="icon" id="tool-line" onclick="setTool('line')" title="Line — drag (L)">╱</button>
    <button class="icon" id="tool-pick" onclick="setTool('pick')" title="Pick terrain (I, or right-click)">💉</button>
    <span class="tb-sep"></span>
    <button class="icon" id="tool-raise" onclick="setTool('raise')" title="Raise land: sea → shore → land → hills → mountains (E)">⛰</button>
    <button class="icon" id="tool-lower" onclick="setTool('lower')" title="Lower land: mountains → hills → land → shore → sea (D)">🌊</button>
    <button class="icon" id="tool-smooth" onclick="setTool('smooth')" title="Smooth: blend each hex into its neighbours (S)">〰</button>
  </div>
  <div class="tb-sep"></div>
  <div class="tb-group" title="Brush size ( [ and ] )">
    <span class="tb-lbl">Size</span>
    <input type="range" id="brush-size" min="1" max="15" value="1" oninput="setBrush(+this.value)">
    <span class="tb-val" id="brush-val">1</span>
  </div>
  <div class="tb-group" title="Brush density: below 100% scatters the paint">
    <span class="tb-lbl">Density</span>
    <input type="range" id="brush-density" min="5" max="100" value="100" step="5" oninput="setDensity(+this.value)">
    <span class="tb-val" id="density-val">100</span>
  </div>
  <div class="tb-group" title="Paint mirrored copies at the same time">
    <span class="tb-lbl">Mirror</span>
    <select id="symmetry" onchange="symmetryMode=this.value;requestFx()">
      <option value="none">Off</option>
      <option value="x">East ↔ West</option>
      <option value="y">North ↕ South</option>
      <option value="quad">Four ways</option>
      <option value="radial">Turned 180°</option>
    </select>
  </div>
  <div class="tb-sep"></div>
  <div class="tb-group">
    <button onclick="generateDialog()" class="gold" title="Generate a new world">✨ Generate…</button>
    <button onclick="shapeCoastline()" title="Re-shape the seas: coastal waters along the shore, deep ocean far out">🏝 Coastline</button>
    <button onclick="smoothAll()" title="Smooth the whole map once">〰 Smooth all</button>
  </div>
  <div class="tb-sep"></div>
  <div class="tb-group">
    <button class="icon" id="btn-grid" onclick="toggleView('grid')" title="Hex grid (H)">#</button>
    <button class="icon active" id="btn-sprites" onclick="toggleView('sprites')" title="Tile art">🎨</button>
    <button class="icon" id="btn-wrap" onclick="toggleView('wrap')" title="Show the east-west wrap — the game's world is round (W)">🔁</button>
    <button class="icon" onclick="zoomCanvas(-1)" title="Zoom out">−</button>
    <span class="tb-val" id="zoom-badge" style="cursor:pointer;min-width:40px" onclick="setZoom(1)" title="Reset to 100%">100%</span>
    <button class="icon" onclick="zoomCanvas(1)" title="Zoom in">+</button>
    <button onclick="fitCanvas()" title="Fit map (0)">Fit</button>
    <button class="icon" onclick="showHelp()" title="Shortcuts (?)">?</button>
  </div>
</div>

<div id="main">
  <div id="palette">
    <div class="palette-tabs">
      <button class="pal-tab active" id="tab-terrain" onclick="setLayer('terrain')" title="1">🌍 Terrain</button>
      <button class="pal-tab" id="tab-places" onclick="setLayer('places')" title="2">🏰 Places</button>
      <button class="pal-tab" id="tab-realms" onclick="setLayer('realms')" title="3">👑 Realms</button>
    </div>
    <div class="pal-body show" id="pal-terrain">
      <input type="text" class="pal-search" id="terrain-search" placeholder="Search terrain…" oninput="buildTerrainPalette()">
      <div class="recent" id="recent-terrain"></div>
      <div id="terrain-list"></div>
    </div>
    <div class="pal-body" id="pal-places">
      <div id="places-list"></div>
    </div>
    <div class="pal-body" id="pal-realms">
      <div class="seg">
        <button id="realm-mode-lands" class="active" onclick="setRealmMode('lands')" title="Paint the selected realm's lands with the brush, fill, rectangle or line">🖌 Lands</button>
        <button id="realm-mode-capital" onclick="setRealmMode('capital')" title="Click the map to seat the selected realm's capital">👑 Capital</button>
      </div>
      <div id="realm-list"></div>
      <div style="display:flex;gap:4px;margin:6px 0">
        <button style="flex:1" onclick="addRealm()">+ New realm</button>
        <button style="flex:1" onclick="growLands()" title="Claim free land around the selected realm's capital">⤢ Grow lands</button>
      </div>
      <div id="realm-edit"></div>
      <div class="pal-hint">Seat a realm by giving it a capital. Realms without one stay off the map. With no realms seated, the game places its own at random.</div>
    </div>
  </div>

  <div id="canvas-area">
    <canvas id="base-canvas"></canvas>
    <canvas id="fx-canvas"></canvas>
    <div id="drop-hint">Drop a world .json to open it</div>
  </div>

  <div id="props">
    <div class="sec">
      <h3 onclick="toggleSec(this)">World</h3>
      <div class="row"><label>Name</label><input type="text" id="world-name" value="Custom World" oninput="markDirty()"></div>
      <div class="row"><label>Author</label><input type="text" id="world-author" value="" oninput="markDirty()"></div>
      <div class="row"><label>Seed</label><input type="number" id="world-seed" value="0" style="width:90px" oninput="markDirty()"><button class="icon" onclick="rollSeed()" title="New seed">🎲</button></div>
      <div class="row"><label>Size</label><input type="number" id="map-w" value="70" min="10" max="500" style="width:48px"><span style="flex:0">×</span><input type="number" id="map-h" value="45" min="10" max="500" style="width:48px"><button onclick="resizeMap()" title="Resize (keeps the top-left)">Resize</button></div>
    </div>
    <div class="sec" id="sec-selected" style="display:none">
      <h3>Selected place</h3>
      <div class="row"><label>Kind</label><span id="sel-type">—</span></div>
      <div class="row"><label>Name</label><input type="text" id="sel-name" placeholder="(a name is drawn in play)" oninput="renameSelected(this.value)"><button class="icon" onclick="randomName()" title="Random name">🎲</button></div>
      <div class="row"><label>At</label><span id="sel-at">—</span><button class="danger" onclick="removeOverlayAtSelected()">Remove</button></div>
    </div>
    <div class="sec" id="sec-check">
      <h3 onclick="toggleSec(this)">Map check <span class="badge" id="check-badge">—</span></h3>
      <div id="issues"></div>
    </div>
    <div class="sec collapsed" id="sec-rules">
      <h3 onclick="toggleSec(this)">Rules in play</h3>
      <div class="row"><label title="Used when no realm is seated">Random realms</label><input type="number" id="rule-kingdoms" value="6" min="1" max="15" onchange="markDirty()"></div>
      <div class="row"><label>Wild villages</label><select id="rule-villages" onchange="markDirty()"><option value="none">None</option><option value="few">Few</option><option value="normal" selected>Normal</option><option value="many">Many</option></select></div>
      <div class="row"><label>Ruins &amp; sites</label><select id="rule-ruins" onchange="markDirty()"><option value="none">None</option><option value="few">Few</option><option value="normal" selected>Normal</option><option value="many">Many</option></select></div>
      <div class="row"><label><input type="checkbox" id="rule-roads" checked onchange="markDirty()"> Roads join the towns</label></div>
      <div class="row"><label><input type="checkbox" id="rule-towns" checked onchange="markDirty()"> Realms without towns found 1–2</label></div>
    </div>
    <div class="sec collapsed" id="sec-stats">
      <h3 onclick="toggleSec(this)">Statistics</h3>
      <div id="stats-content">—</div>
    </div>
    <div class="sec" style="margin-top:auto;border-bottom:none">
      <h3>Minimap</h3>
      <canvas id="minimap-canvas" width="226" height="140"></canvas>
    </div>
  </div>
</div>

<div id="statusbar">
  <span>Hex <b id="st-coord">—</b></span>
  <span><b id="st-terrain">—</b></span>
  <span id="st-extra"></span>
  <span id="status-hint"></span>
  <span id="st-save"></span>
</div>
<input type="file" id="file-input" accept=".json,application/json" style="display:none">

<script>
'use strict';
const WT = window.WorldTools;

// ═══════════════════════════════════════════════════════════════
//  CONTENT
// ═══════════════════════════════════════════════════════════════
const TERRAIN_TYPES = {
    deep_ocean:           { name:'Deep Ocean',           color:'#002b59', moveCost:Infinity },
    ocean:                { name:'Ocean',                color:'#005b96', moveCost:Infinity },
    sea:                  { name:'Sea',                  color:'#0077be', moveCost:Infinity },
    coast:                { name:'Coastal Waters',       color:'#6497b1', moveCost:Infinity },
    lake:                 { name:'Lake',                 color:'#5dade2', moveCost:Infinity },
    grassland:            { name:'Grassland',            color:'#88aa55', moveCost:2 },
    plains:               { name:'Plains',               color:'#7daa4e', moveCost:2 },
    savanna:              { name:'Savanna',              color:'#ddbb66', moveCost:2 },
    beach:                { name:'Beach',                color:'#e8d5a3', moveCost:2 },
    island:               { name:'Island',               color:'#e8d5a3', moveCost:3 },
    swamp:                { name:'Swamp',                color:'#4a6a3a', moveCost:4 },
    woodland:             { name:'Woodland',             color:'#668844', moveCost:2 },
    seasonal_forest:      { name:'Seasonal Forest',      color:'#557733', moveCost:3 },
    boreal_forest:        { name:'Boreal Forest',        color:'#446633', moveCost:3 },
    temperate_rainforest: { name:'Temperate Rainforest', color:'#335522', moveCost:3 },
    tropical_rainforest:  { name:'Tropical Rainforest',  color:'#224411', moveCost:4 },
    desert:               { name:'Desert',               color:'#d4a843', moveCost:3 },
    tundra:               { name:'Tundra',               color:'#bce4ce', moveCost:2 },
    snow:                 { name:'Snow',                 color:'#ffffff', moveCost:3 },
    ice:                  { name:'Ice Sheet',            color:'#e5f9ff', moveCost:3 },
    hills:                { name:'Hills',                color:'#8a7a5a', moveCost:3 },
    highlands:            { name:'Highlands',            color:'#6d7a5b', moveCost:4 },
    mountain:             { name:'Mountain',             color:'#808080', moveCost:5 },
    snow_peak:            { name:'Snow Peak',            color:'#f0f0f0', moveCost:Infinity },
};
// Fixed order: the index is the undo snapshot code — append only
const TERRAIN_ORDER = ['deep_ocean','ocean','coast','sea','beach','lake','ice','snow','tundra','grassland','plains','woodland','boreal_forest','seasonal_forest','temperate_rainforest','tropical_rainforest','savanna','desert','hills','mountain','snow_peak','swamp','island','highlands'];
const TERRAIN_GROUPS = [
    ['Water', ['deep_ocean','ocean','sea','coast','lake']],
    ['Lowland', ['grassland','plains','savanna','beach','island','swamp']],
    ['Forest', ['woodland','seasonal_forest','boreal_forest','temperate_rainforest','tropical_rainforest']],
    ['Arid & cold', ['desert','tundra','snow','ice']],
    ['High ground', ['hills','highlands','mountain','snow_peak']],
];

const spriteCache = {};
let spritesPending = 0;

function spritePaths() {
    const set = new Set();
    for (const list of Object.values(TERRAIN_SPRITES)) list.forEach(p => set.add(p));
    for (const list of Object.values(PLACE_SPRITES)) list.forEach(p => set.add(p));
    for (const [mask, n] of Object.entries(ROAD_VARIANTS)) for (let v = 0; v < n; v++) set.add(`roads/hexRoad-${mask}-${String(v).padStart(2, '0')}.png`);
    for (let m = 1; m < 64; m++) set.add(`rivers/hexRiver${m.toString(2).padStart(6, '0')}-00.png`);
    return [...set];
}
function loadSprites() {
    const paths = spritePaths();
    spritesPending = paths.length;
    let redrawTimer = null;
    const done = () => {
        spritesPending--;
        clearTimeout(redrawTimer);
        redrawTimer = setTimeout(() => { buildTerrainPalette(); buildPlacesPalette(); requestRender(); }, spritesPending ? 250 : 0);
    };
    for (const p of paths) {
        const img = new Image();
        img.onload = () => { spriteCache[p] = img; done(); };
        img.onerror = done;
        img.src = TILE_BASE + p;
    }
}
function terrainSprite(id, q, r) {
    const paths = TERRAIN_SPRITES[id];
    if (!paths) return null;
    return spriteCache[paths[EditorCore.variantHash(q, r, paths.length)]] || null;
}
function placeSprite(type) {
    const paths = PLACE_SPRITES[type];
    if (!paths) return null;
    for (const p of paths) if (spriteCache[p]) return spriteCache[p];
    return null;
}
function firstSpriteUrl(paths) {
    const p = paths && paths.find(x => spriteCache[x]);
    return p ? TILE_BASE + p : null;
}

function snapshot() {
    return {
        w: mapW, h: mapH,
        t: WT.encode(tiles, TERRAIN_ORDER),
        o: JSON.stringify({ overlays, roadOverlays, rivers, territory, realms, playerStart }),
    };
}
function restore(s) {
    mapW = s.w; mapH = s.h;
    tiles = WT.decode(s.t, TERRAIN_ORDER);
    const o = JSON.parse(s.o);
    overlays = o.overlays; roadOverlays = o.roadOverlays; rivers = o.rivers;
    territory = o.territory; realms = o.realms; playerStart = o.playerStart;
    document.getElementById('map-w').value = mapW;
    document.getElementById('map-h').value = mapH;
    if (!realmById(selectedRealm)) selectedRealm = realms[0] ? realms[0].id : null;
    afterChange(true);
}
const undoStack = EditorCore.createUndoStack({ max: 80, snapshot, restore });
function checkpoint() { undoStack.push(); updateUndoButtons(); }
function undo() { if (undoStack.undo()) { updateUndoButtons(); toast('Undone'); } }
function redo() { if (undoStack.redo()) { updateUndoButtons(); toast('Redone'); } }
function updateUndoButtons() {
    document.getElementById('btn-undo').disabled = !undoStack.canUndo();

}

const AUTOSAVE_KEY = 'lotr-world-editor-autosave';
const RESUME_KEY = 'lotr-world-editor-resume';
// Held while the editor boots, so the blank start map can't overwrite the
// save it is about to offer back
let autosaveHeld = true;
function autosave() {
    if (autosaveHeld) return;
    try {
        const data = getExportData();
        data.tiles = WT.rle(data.tiles);
        data.savedAt = Date.now();
        localStorage.setItem(AUTOSAVE_KEY, JSON.stringify(data));
        document.getElementById('st-save').textContent = 'Autosaved ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    } catch (e) {
        document.getElementById('st-save').textContent = 'Autosave failed (storage full?)';
    }
}
function readAutosave() {
    try {
        const raw = localStorage.getItem(AUTOSAVE_KEY);
        if (!raw) return null;
        const data = JSON.parse(raw);
        data.tiles = WT.unrle(data.tiles);
        return data.tiles.length === data.width * data.height ? data : null;
    } catch (e) { return null; }
}
async function restoreAutosave(ask) {
    closeMenus();
    const data = readAutosave();
    if (!data) { autosaveHeld = false; if (ask) toast('No autosave found'); return; }
    if (ask) {
        const when = new Date(data.savedAt).toLocaleString();
        const ok = await EditorUI.confirm(`Open "${data.name || 'Untitled'}" (${data.width}×${data.height}), autosaved ${when}? Unsaved changes here are kept in undo.`, { title: 'Restore autosave', okText: 'Restore' });
        autosaveHeld = false;
        if (!ok) return;
        checkpoint();
    }
    autosaveHeld = false;
    loadWorldData(data, { keepHistory: !!ask });
    toast('Autosave restored');
}

    resizeCanvas();

    // Back from a playtest (or a crash): pick up where the map was left
    let resume = false;
    try { resume = sessionStorage.getItem(RESUME_KEY) === '1'; sessionStorage.removeItem(RESUME_KEY); } catch (e) { /* storage off */ }
    const saved = readAutosave();
    if (saved && resume) { autosaveHeld = false; loadWorldData(saved); toast('Welcome back — your map is as you left it'); }
    else if (saved && saved.tiles.some(t => t !== 'ocean')) restoreAutosave(true);
    else autosaveHeld = false;
}

function newMap(w, h, fillId) {
    mapW = w; mapH = h;
    tiles = new Array(w * h).fill(fillId || 'ocean');
    overlays = {}; roadOverlays = {}; rivers = {}; territory = {};
    realms.forEach(r => { r.capital = null; });
    playerStart = null; selectedHex = null;
    document.getElementById('map-w').value = w;
    document.getElementById('map-h').value = h;
    resizeCanvas();
    fitCanvas();
    afterChange(true);
}

async function newMapDialog() {
    closeMenus();
    const res = await EditorUI.form('New map', [
        { key: 'w', label: 'Width (hexes)', type: 'number', value: mapW },
        { key: 'h', label: 'Height (hexes)', type: 'number', value: mapH },
    ]);
    if (!res) return;
    const w = clampInt(res.w, 10, 500, 70), h = clampInt(res.h, 10, 500, 45);
    checkpoint();
    newMap(w, h, 'ocean');
}
function clampInt(v, lo, hi, dflt) { const n = parseInt(v, 10); return Number.isFinite(n) ? Math.max(lo, Math.min(hi, n)) : dflt; }

function resizeMap() {
    const w = clampInt(document.getElementById('map-w').value, 10, 500, mapW);
    const h = clampInt(document.getElementById('map-h').value, 10, 500, mapH);
    if (w === mapW && h === mapH) return;
    checkpoint();
    const next = new Array(w * h).fill('ocean');
    for (let r = 0; r < Math.min(h, mapH); r++) for (let q = 0; q < Math.min(w, mapW); q++) next[r * w + q] = tiles[r * mapW + q];
    const keep = (obj) => { for (const k of Object.keys(obj)) { const [q, r] = k.split(',').map(Number); if (q >= w || r >= h) delete obj[k]; } };
    keep(overlays); keep(roadOverlays); keep(rivers); keep(territory);
    for (const rm of realms) if (rm.capital && (rm.capital.q >= w || rm.capital.r >= h)) rm.capital = null;
    if (playerStart && (playerStart.q >= w || playerStart.r >= h)) playerStart = null;
    mapW = w; mapH = h; tiles = next;
    fitCanvas();
    afterChange(true);
}

function swatchHtml(id) {
    const t = TERRAIN_TYPES[id];
    const url = firstSpriteUrl(TERRAIN_SPRITES[id]);
    return `<span class="pal-swatch" style="${url ? `background-image:url(${url});` : ''}background-color:${t.color}"></span>`;
}
function buildTerrainPalette() {
    const term = (document.getElementById('terrain-search').value || '').toLowerCase();
    const list = document.getElementById('terrain-list');
    let html = '';
    for (const [label, ids] of TERRAIN_GROUPS) {
        const shown = ids.filter(id => !term || TERRAIN_TYPES[id].name.toLowerCase().includes(term));
        if (!shown.length) continue;
        html += `<div class="pal-cat">${label}</div>`;
        for (const id of shown) {
            const t = TERRAIN_TYPES[id];
            const note = !t.passable ? '⛔' : t.moveCost > 2 ? '·'.repeat(t.moveCost - 1) : '';
            html += `<div class="pal-item${id === selectedTerrain ? ' active' : ''}" data-id="${id}" title="${t.name} — ${t.passable ? 'move cost ' + t.moveCost : 'impassable'}">` +
                `${swatchHtml(id)}<span class="pal-name">${t.name}</span><span class="pal-note">${note}</span></div>`;
        }
    }
    list.innerHTML = html || '<div class="pal-hint">No terrain matches.</div>';
    list.querySelectorAll('.pal-item').forEach(el => el.onclick = () => selectTerrain(el.dataset.id));
    const rec = document.getElementById('recent-terrain');
    rec.innerHTML = recentTerrain.map(id => {
        const url = firstSpriteUrl(TERRAIN_SPRITES[id]);
        return `<span data-id="${id}" title="${TERRAIN_TYPES[id].name}" style="${url ? `background-image:url(${url});` : ''}background-color:${TERRAIN_TYPES[id].color}"></span>`;
    }).join('');
    rec.querySelectorAll('span').forEach(el => el.onclick = () => selectTerrain(el.dataset.id));
}
function selectTerrain(id) {
    if (!TERRAIN_TYPES[id]) return;
    selectedTerrain = id;
    recentTerrain = [id, ...recentTerrain.filter(x => x !== id)].slice(0, 8);
    if (activeLayer !== 'terrain') setLayer('terrain');
    if (activeTool === 'pick' || activeTool === 'raise' || activeTool === 'lower' || activeTool === 'smooth') setTool('paint');
    buildTerrainPalette();
    setHint();
}

function buildPlacesPalette() {
    let html = '';
    for (const [cat, label] of PLACE_CATS) {
        html += `<div class="pal-cat">${label}</div>`;
        for (const [id, p] of Object.entries(PLACE_TYPES)) {
            if (p.cat !== cat) continue;
            const url = firstSpriteUrl(PLACE_SPRITES[id]);
            html += `<div class="pal-item${id === selectedPlace ? ' active' : ''}" data-id="${id}" title="${p.name}${p.note ? ' — ' + p.note : ''}">` +
                `<span class="pal-swatch" style="background:${p.color}22;border-color:${p.color}88">${url ? `<img src="${url}" alt="">` : p.icon}</span>` +

function buildRealmPanel() {

async function removeRealm() {

// Claim free walkable land around the capital, out to 4 steps over land
function growLands() {
    const rm = realmById(selectedRealm);
    if (!rm || !rm.capital) { toast('Seat the realm first (👑 Capital)'); return; }
    checkpoint();
    const start = rm.capital;
    const dist = { [key(start.q, start.r)]: 0 };
    const queue = [start];
    let claimed = 0;
    while (queue.length) {
        const c = queue.shift();
        const k = key(c.q, c.r);
        if (!territory[k] && WT.isPassable(getTile(c.q, c.r))) { territory[k] = rm.id; claimed++; }
        if (dist[k] >= 4) continue;
        for (const n of WT.neighbors(c.q, c.r, mapW, mapH, true)) {
            const nk = key(n.q, n.r);
            if (nk in dist) continue;
            if (!WT.isPassable(getTile(n.q, n.r)) || (territory[nk] && territory[nk] !== rm.id)) continue;
            dist[nk] = dist[k] + 1;
            queue.push(n);
        }
    }
    afterChange(true);
    toast(`${rm.name} claims ${claimed} hexes`);
}

function setLayer(layer) {

// Hexes the brush covers at (q, r), every mirror included
function brushCells(q, r, radius) {
    const out = [], seen = new Set();
    for (const p of WT.symmetry(q, r, mapW, mapH, symmetryMode)) {
        const cells = view.wrap ? WT.disc(p.q, p.r, radius, 1e9, mapH) : WT.disc(p.q, p.r, radius, mapW, mapH);
        for (const c of cells) {
            if (c.r < 0 || c.r >= mapH) continue;
            const cq = WT.wrapQ(c.q, mapW), k = c.r * mapW + cq;
            if (!seen.has(k)) { seen.add(k); out.push({ q: cq, r: c.r }); }
        }
    }
    return out;
}
function withMirrors(cells) {
    const out = [], seen = new Set();
    for (const c of cells) for (const p of WT.symmetry(c.q, c.r, mapW, mapH, symmetryMode)) {
        const k = p.r * mapW + p.q;
        if (!seen.has(k)) { seen.add(k); out.push(p); }
    }
    return out;
}

// Apply the current layer's paint to a set of cells
function paintCells(cells, erase) {
    if (activeLayer === 'terrain') {
        if (activeTool === 'raise' || activeTool === 'lower') {
            const dir = activeTool === 'raise' ? 1 : -1;
            for (const c of cells) {
                if (brushDensity < 1 && Math.random() > brushDensity) continue;
                const k = c.r * mapW + c.q;
                tiles[k] = WT.stepTerrain(tiles[k], dir, lowlandNear(c.q, c.r));
            }
        } else if (activeTool === 'smooth') {
            tiles = WT.smooth(tiles, mapW, mapH, cells, { wrap: true });
        } else {
            for (const c of cells) {
                if (brushDensity < 1 && Math.random() > brushDensity) continue;
                tiles[c.r * mapW + c.q] = selectedTerrain;
            }
        }
    } else if (activeLayer === 'places') {
        const type = erase ? 'eraser' : selectedPlace;
        for (const c of cells) {
            const k = key(c.q, c.r);
            if (type === 'eraser') { delete overlays[k]; delete roadOverlays[k]; delete rivers[k]; if (playerStart && playerStart.q === c.q && playerStart.r === c.r) playerStart = null; }
            else if (type === 'river') { if (WT.isLand(getTile(c.q, c.r))) rivers[k] = true; }
            else if (type === 'road' || type === 'trade_road') roadOverlays[k] = { type };
            else if (type === 'start') playerStart = { q: c.q, r: c.r };
            else {
                const old = overlays[k];
                overlays[k] = { type, name: old && old.type === type ? old.name : '' };
                selectedHex = { q: c.q, r: c.r };
            }
        }
    } else if (activeLayer === 'realms') {
        for (const c of cells) {
            const k = key(c.q, c.r);
            if (erase) delete territory[k];
            else if (selectedRealm && WT.isLand(getTile(c.q, c.r))) territory[k] = selectedRealm;
        }
    }
    minimapDirty = true;
    requestRender();
}
// The lowland biome a raised hex should take: the commonest around it
function lowlandNear(q, r) {
    const votes = {};
    for (const n of WT.neighbors(q, r, mapW, mapH, true)) {
        const t = getTile(n.q, n.r);
        if (WT.RUNG[t] === 4) votes[t] = (votes[t] || 0) + 1;
    }
    let best = WT.RUNG[selectedTerrain] === 4 ? selectedTerrain : 'grassland', n = 0;
    for (const t in votes) if (votes[t] > n) { best = t; n = votes[t]; }
    return best;
}

function fillAt(q, r, erase) {
    let valueAt;
    if (activeLayer === 'realms') valueAt = (a, b) => (WT.isLand(getTile(a, b)) ? 'L' : 'W') + (territory[key(a, b)] || '');
    else valueAt = (a, b) => getTile(a, b);
    const region = WT.floodRegion(q, r, mapW, mapH, valueAt);
    if (activeLayer === 'realms' && !WT.isLand(getTile(q, r))) return;
    paintCells(withMirrors(region), erase);
}

// Stamp a settlement/landmark/start at (q, r) and its mirrors
function placeAt(q, r) {
    paintCells(withMirrors([{ q, r }]));
    updateSelectedInfo();
}

function seatCapital(q, r) {
    const rm = realmById(selectedRealm);
    if (!rm) return;
    rm.capital = { q, r };
    if (WT.isLand(getTile(q, r)) && !territory[key(q, r)]) territory[key(q, r)] = rm.id;
    afterChange(true);
    toast(`${rm.name} is seated at ${q},${r}`);
}

function drawPreview(cv, t, riv, w, h) {
    const c = cv.getContext('2d');
    const img = c.createImageData(w * 2 + 1, h);
    for (let r = 0; r < h; r++) for (let q = 0; q < w; q++) {
        const rgb = hexRgb(TERRAIN_TYPES[t[r * w + q]].color);
        const col = riv[q + ',' + r] ? [74, 163, 255] : rgb;
        for (let s = 0; s < 2; s++) {
            const i = (r * (w * 2 + 1) + q * 2 + (r % 2 === 0 ? 1 : 0) + s) * 4;
            img.data[i] = col[0]; img.data[i + 1] = col[1]; img.data[i + 2] = col[2]; img.data[i + 3] = 255;
        }
    }
    const tmp = document.createElement('canvas');
    tmp.width = w * 2 + 1; tmp.height = h;
    tmp.getContext('2d').putImageData(img, 0, 0);
    c.imageSmoothingEnabled = false;
    c.fillStyle = '#05080d';
    c.fillRect(0, 0, cv.width, cv.height);
    // Each buffer pixel is half a hex wide and a row tall
    const rowAspect = ROW_H / (HEX_W / 2);
    const s = Math.min(cv.width / tmp.width, cv.height / (h * rowAspect));
    const dw = tmp.width * s, dh = h * rowAspect * s;
    c.drawImage(tmp, (cv.width - dw) / 2, (cv.height - dh) / 2, dw, dh);
}

// ═══════════════════════════════════════════════════════════════
//  RENDERING
// ═══════════════════════════════════════════════════════════════
let renderQueued = false, fxQueued = false, minimapDirty = true;
function requestRender() {
    if (renderQueued) return;
    renderQueued = true;
    requestAnimationFrame(() => { renderQueued = false; render(); });
}
function requestFx() {
    if (fxQueued) return;
    fxQueued = true;
    requestAnimationFrame(() => { fxQueued = false; renderFx(); });
}

function hexToPixel(q, r) {
    return { x: q * HEX_W + (r % 2 === 0 ? HEX_W / 2 : 0) + HEX_W / 2, y: r * ROW_H + HEX_SIZE };
}
function pixelToHex(px, py) {
    const approxR = Math.round((py - HEX_SIZE) / ROW_H);
    let best = null, bestD = Infinity;
    for (let dr = -1; dr <= 1; dr++) {
        const r = approxR + dr;
        const approxQ = Math.round((px - HEX_W / 2 - (r % 2 === 0 ? HEX_W / 2 : 0)) / HEX_W);
        for (let dq = -1; dq <= 1; dq++) {
            const p = hexToPixel(approxQ + dq, r);
            const d = (px - p.x) ** 2 + (py - p.y) ** 2;
            if (d < bestD) { bestD = d; best = { q: approxQ + dq, r }; }
        }
    }
    return best;
}
const HEX_CORNERS = Array.from({ length: 6 }, (_, i) => {
    const a = Math.PI / 180 * (60 * i - 30);
    return [HEX_SIZE * Math.cos(a), HEX_SIZE * Math.sin(a)];
});
// Corner pairs for the edge facing each neighbour direction (E NE NW W SW SE)
const EDGE = [[0, 1], [5, 0], [4, 5], [3, 4], [2, 3], [1, 2]];
function hexPath(c, cx, cy, scale = 1) {
    c.beginPath();
    c.moveTo(cx + HEX_CORNERS[0][0] * scale, cy + HEX_CORNERS[0][1] * scale);
    for (let i = 1; i < 6; i++) c.lineTo(cx + HEX_CORNERS[i][0] * scale, cy + HEX_CORNERS[i][1] * scale);
    c.closePath();
}
function drawSpriteHex(c, cx, cy, sprite) {
    const scale = Math.max(HEX_W / sprite.width, HEX_H / sprite.height);
    const w = sprite.width * scale, h = sprite.height * scale;
    c.drawImage(sprite, cx - w / 2, cy + HEX_SIZE - h, w, h);
}
function hexRgb(hex) { return [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16)); }
function hslHex(h, s, l) {
    s /= 100; l /= 100;

// One-pixel-per-half-hex picture of the map (zoomed-out view, minimap, preview)
let colorCanvas = null;
function rebuildColorCanvas() {
    const w = mapW * 2 + 1;

    colorCanvas.width = w; colorCanvas.height = mapH;
    const c = colorCanvas.getContext('2d');
    const img = c.createImageData(w, mapH);
    const rgbCache = {};
    for (let r = 0; r < mapH; r++) for (let q = 0; q < mapW; q++) {
        const k = key(q, r);
        let col = rgbCache[tiles[r * mapW + q]] || (rgbCache[tiles[r * mapW + q]] = hexRgb(TERRAIN_TYPES[tiles[r * mapW + q]].color));
        if (rivers[k]) col = [74, 163, 255];

        const realm = territory[k] && realmById(territory[k]);
        if (realm) { const rc = hexRgb(realm.color); col = col.map((v, i) => Math.round(v * 0.55 + rc[i] * 0.45)); }
        for (let s = 0; s < 2; s++) {
            const i = (r * w + q * 2 + (r % 2 === 0 ? 1 : 0) + s) * 4;
            img.data[i] = col[0]; img.data[i + 1] = col[1]; img.data[i + 2] = col[2]; img.data[i + 3] = 255;

function render() {
    if (minimapDirty) rebuildColorCanvas();
    const dpr = window.devicePixelRatio || 1;
    drawWorld(ctx, { x: camX, y: camY, zoom: camZoom, w: viewW(), h: viewH(), dpr });
    if (minimapDirty) { renderMinimap(); minimapDirty = false; } else renderMinimapFrame();
    renderFx();
}

/**
 * Draw the map into `c` for the view { x, y, zoom, w, h, dpr }: terrain,
 * rivers, roads, realm lands, places, labels. Shared by the canvas and the
 * picture export.

function drawWorld(c, v, opts = {}) {
    const dpr = v.dpr || 1;
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.fillStyle = '#05080d';
    c.fillRect(0, 0, v.w * dpr, v.h * dpr);
    c.setTransform(v.zoom * dpr, 0, 0, v.zoom * dpr, -v.x * v.zoom * dpr, -v.y * v.zoom * dpr);

    const hexPx = HEX_W * v.zoom;
    const lod = hexPx < 7 && !opts.full;
    const wrap = view.wrap && !opts.full;
    const span = worldPxW() - HEX_W / 2;  // one full turn of the world east-west
    const x1 = v.x - HEX_W, y1 = v.y - HEX_H, x2 = v.x + v.w / v.zoom + HEX_W, y2 = v.y + v.h / v.zoom + HEX_H;

    if (lod) {

            c.globalAlpha = k === 0 ? 1 : 0.45;
            c.drawImage(colorCanvas, k * span, HEX_SIZE - ROW_H / 2, (mapW * 2 + 1) * HEX_W / 2, mapH * ROW_H);
        }

        c.imageSmoothingEnabled = true;
    } else {
        const rMin = Math.max(0, Math.floor((y1 - HEX_SIZE) / ROW_H));
        const rMax = Math.min(mapH - 1, Math.ceil((y2 - HEX_SIZE) / ROW_H));

        if (!wrap) { qMin = Math.max(0, qMin); qMax = Math.min(mapW - 1, qMax); }

        const each = (fn) => {
            for (let i = 0; i < cells.length; i += 2) {

                const wq = WT.wrapQ(q, mapW);
                const ghost = q !== wq;

            }
        };
        // Terrain
        each((q, r, p) => {
            const id = tiles[r * mapW + q];
            const sprite = view.sprites ? terrainSprite(id, q, r) : null;
            if (sprite) drawSpriteHex(c, p.x, p.y, sprite);
            else { hexPath(c, p.x, p.y, 1.02); c.fillStyle = TERRAIN_TYPES[id].color; c.fill(); }
        });
        // Rivers, then roads (sprites, or lines without art)
        each((q, r, p) => {
            const k = key(q, r);
            if (rivers[k]) {
                const mask = WT.connectionMask(q, r, mapW, mapH, (a, b) => rivers[key(a, b)] || WT.isWater(getTile(a, b)), true);
                const sp = view.sprites && spriteCache[`rivers/hexRiver${mask}-00.png`];
                if (sp) drawSpriteHex(c, p.x, p.y, sp);
                else drawLinks(c, q, r, p, (a, b) => rivers[key(a, b)] || WT.isWater(getTile(a, b)), '#4aa3ff', 3.5);
            }
            if (roadOverlays[k]) {
                const mask = WT.connectionMask(q, r, mapW, mapH, (a, b) => !!roadOverlays[key(a, b)], true);
                const n = ROAD_VARIANTS[mask];
                const sp = view.sprites && n && spriteCache[`roads/hexRoad-${mask}-${String(EditorCore.variantHash(q, r, n)).padStart(2, '0')}.png`];
                if (sp) drawSpriteHex(c, p.x, p.y, sp);
                else drawLinks(c, q, r, p, (a, b) => !!roadOverlays[key(a, b)], roadOverlays[k].type === 'trade_road' ? '#e0b860' : '#a0855a', 2.5, true);
            }
        });
        // Realm lands: a wash and a border
        each((q, r, p) => {
            const id = territory[key(q, r)];
            if (!id) return;
            const rm = realmById(id);
            if (!rm) return;
            hexPath(c, p.x, p.y);
            c.fillStyle = rm.color + (activeLayer === 'realms' ? '55' : '30');
            c.fill();
            c.strokeStyle = rm.color;
            c.lineWidth = 2.2;
            c.lineCap = 'round';
            for (const n of WT.neighbors(q, r, mapW, mapH, true)) {
                if (territory[key(n.q, n.r)] === id) continue;
                const [a, b] = EDGE[n.dir];
                c.beginPath();
                c.moveTo(p.x + HEX_CORNERS[a][0] * 0.94, p.y + HEX_CORNERS[a][1] * 0.94);
                c.lineTo(p.x + HEX_CORNERS[b][0] * 0.94, p.y + HEX_CORNERS[b][1] * 0.94);
                c.stroke();
            }
        });
        // Buildings
        if (view.sprites) each((q, r, p) => {
            const o = overlays[key(q, r)];
            const sp = o && placeSprite(o.type);
            if (sp) drawSpriteHex(c, p.x, p.y, sp);
        });

        if (view.grid && hexPx > 10) {
            c.strokeStyle = 'rgba(255,255,255,0.12)';
            c.lineWidth = 1 / v.zoom;
            each((q, r, p) => { hexPath(c, p.x, p.y); c.stroke(); });
        }
    }

    // Labels and markers in screen space, so they stay legible
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    const toScreen = (q, r) => { const p = hexToPixel(q, r); return { x: (p.x - v.x) * v.zoom, y: (p.y - v.y) * v.zoom }; };
    const onScreen = s => s.x > -60 && s.x < v.w + 60 && s.y > -40 && s.y < v.h + 40;
    const showNames = hexPx > 16;
    c.textAlign = 'center';
    for (const [k, o] of Object.entries(overlays)) {
        const pt = PLACE_TYPES[o.type];
        if (!pt) continue;
        const [q, r] = k.split(',').map(Number);
        const s = toScreen(q, r);
        if (!onScreen(s)) continue;
        if (lod || !view.sprites || !placeSprite(o.type)) {
            const rad = Math.max(3, Math.min(9, hexPx * 0.3));
            c.beginPath(); c.arc(s.x, s.y, rad + 1, 0, Math.PI * 2); c.fillStyle = 'rgba(0,0,0,.6)'; c.fill();
            c.beginPath(); c.arc(s.x, s.y, rad, 0, Math.PI * 2); c.fillStyle = pt.color; c.fill();
            if (rad >= 7) { c.font = `${Math.round(rad * 1.4)}px serif`; c.textBaseline = 'middle'; c.fillText(pt.icon, s.x, s.y + 1); }
        }

    }
    for (const rm of realms) {
        if (!rm.capital) continue;
        const s = toScreen(rm.capital.q, rm.capital.r);
        if (!onScreen(s)) continue;
        const sz = Math.max(12, Math.min(22, hexPx * 0.55));
        c.font = `${sz}px serif`;
        c.textBaseline = 'middle';
        c.fillText('👑', s.x, s.y - hexPx * 0.42);
        if (hexPx > 9) label(c, rm.name, s.x, s.y - hexPx * 0.42 - sz * 0.95, 12, rm.color, true);
    }
    if (playerStart) {
        const s = toScreen(playerStart.q, playerStart.r);
        if (onScreen(s)) {
            const sz = Math.max(14, Math.min(24, hexPx * 0.6));
            c.font = `${sz}px serif`; c.textBaseline = 'alphabetic';

}
function label(c, text, x, y, size, color, bold) {

        c.beginPath(); c.moveTo(p.x, p.y);
        c.lineTo(p.x + (HEX_CORNERS[a][0] + HEX_CORNERS[b][0]) / 2, p.y + (HEX_CORNERS[a][1] + HEX_CORNERS[b][1]) / 2);

// ── Effects layer: brush outline, drag previews, selection ──────
let hover = null, dragStart = null, dragCur = null;
function renderFx() {

    fx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
    fx.setTransform(camZoom * dpr, 0, 0, camZoom * dpr, -camX * camZoom * dpr, -camY * camZoom * dpr);
    const outline = (cells, color, fill) => {
        fx.lineWidth = 1.6 / camZoom;
        fx.strokeStyle = color;
        if (fill) fx.fillStyle = fill;

            const p = hexToPixel(cl.q, cl.r);
            hexPath(fx, p.x, p.y);
            if (fill) fx.fill();
            fx.stroke();
        }
    };
    const paintColor = activeLayer === 'terrain' ? TERRAIN_TYPES[selectedTerrain].color
        : activeLayer === 'realms' ? ((realmById(selectedRealm) || {}).color || '#fff')
        : (PLACE_TYPES[selectedPlace] || {}).color || '#fff';
    if (dragStart && dragCur && (activeTool === 'rect' || activeTool === 'line') && !(activeLayer === 'realms' && realmMode === 'capital')) {
        const cells = shapeCells(dragStart, dragCur);
        outline(cells, 'rgba(245,197,66,.9)', paintColor + '88');
    } else if (hover && inBounds(hover.q, hover.r)) {
        let cells;
        const single = activeLayer === 'places' || activeTool === 'fill' || activeTool === 'pick' || (activeLayer === 'realms' && realmMode === 'capital');
        if (single) cells = withMirrors([hover]);
        else cells = brushCells(hover.q, hover.r, brushRadius);
        outline(cells, 'rgba(245,197,66,.85)', activeTool === 'pick' || activeTool === 'smooth' ? null : paintColor + '40');

let flash = null;
function shapeCells(a, b) {
    const cells = activeTool === 'rect' ? WT.rect(a.q, a.r, b.q, b.r, mapW, mapH)
        : WT.line(a.q, a.r, b.q, b.r).filter(c => inBounds(c.q, c.r));
    if (activeTool === 'line' && brushRadius > 0 && activeLayer !== 'places') {

// ── Minimap ──────────────────────────────────────────────────
let minimapFrame = null;
function renderMinimap() {
    const mc = document.getElementById('minimap-canvas');
    const aspect = worldPxH() / worldPxW();
    mc.height = Math.max(60, Math.min(220, Math.round(mc.width * aspect)));
    const m = mc.getContext('2d');
    m.imageSmoothingEnabled = false;
    m.fillStyle = '#05080d';
    m.fillRect(0, 0, mc.width, mc.height);
    m.drawImage(colorCanvas, 0, 0, mc.width, mc.height);
    for (const [k, o] of Object.entries(overlays)) {
        const [q, r] = k.split(',').map(Number);
        m.fillStyle = PLACE_TYPES[o.type] ? PLACE_TYPES[o.type].color : '#fff';
        m.fillRect((q + 0.5) / mapW * mc.width - 1, (r + 0.5) / mapH * mc.height - 1, 2.5, 2.5);
    }
    minimapFrame = m.getImageData(0, 0, mc.width, mc.height);

function renderMinimapFrame() {
    const mc = document.getElementById('minimap-canvas');
    const m = mc.getContext('2d');
    if (minimapFrame) m.putImageData(minimapFrame, 0, 0);
    const sx = mc.width / worldPxW(), sy = mc.height / worldPxH();
    m.strokeStyle = 'rgba(245,197,66,.9)';
    m.lineWidth = 1.5;
    m.strokeRect(camX * sx, camY * sy, viewW() / camZoom * sx, viewH() / camZoom * sy);

// ═══════════════════════════════════════════════════════════════
//  CAMERA
// ═══════════════════════════════════════════════════════════════
function updateZoomBadge() { document.getElementById('zoom-badge').textContent = Math.round(camZoom * 100) + '%'; }
function zoomAround(factor, sx, sy) {
    const old = camZoom;
    camZoom = Math.max(0.05, Math.min(6, camZoom * factor));
    camX = sx / old + camX - sx / camZoom;
    camY = sy / old + camY - sy / camZoom;
    updateZoomBadge();
    requestRender();
}
function zoomCanvas(dir) { zoomAround(dir > 0 ? 1.25 : 0.8, viewW() / 2, viewH() / 2); }
function setZoom(z) { zoomAround(z / camZoom, viewW() / 2, viewH() / 2); }

    camX = -(viewW() / camZoom - worldPxW()) / 2;
    camY = -(viewH() / camZoom - worldPxH()) / 2;

    requestRender();
}

    const p = hexToPixel(q, r);

    camX = p.x - viewW() / 2 / camZoom;
    camY = p.y - viewH() / 2 / camZoom;
    updateZoomBadge();

    requestRender();

// ═══════════════════════════════════════════════════════════════
//  INPUT
// ═══════════════════════════════════════════════════════════════
let panning = null, spaceDown = false, stroke = null;
function eventHex(e) {
    const rect = fxCanvas.getBoundingClientRect();
    const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
    const h = pixelToHex(sx / camZoom + camX, sy / camZoom + camY);
    if (!h || h.r < 0 || h.r >= mapH) return null;
    if (view.wrap) h.q = WT.wrapQ(h.q, mapW);
    return inBounds(h.q, h.r) ? h : null;
}

function bindInput() {
    const area = document.getElementById('canvas-area');
    fxCanvas.addEventListener('mousedown', onDown);
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
    fxCanvas.addEventListener('mouseleave', () => { hover = null; requestFx(); });
    fxCanvas.addEventListener('wheel', e => {
        e.preventDefault();
        const rect = fxCanvas.getBoundingClientRect();
        const f = Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0015));
        zoomAround(f, e.clientX - rect.left, e.clientY - rect.top);
    }, { passive: false });
    fxCanvas.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', onKey);
    document.addEventListener('keyup', e => { if (e.code === 'Space') { spaceDown = false; area.classList.remove('space'); } });
    document.addEventListener('mousedown', e => { if (!e.target.closest('.menu')) closeMenus(); });

    // Minimap: click or drag to look
    const mm = document.getElementById('minimap-canvas');
    const lookAt = e => {
        const rect = mm.getBoundingClientRect();
        const fxp = (e.clientX - rect.left) / rect.width, fyp = (e.clientY - rect.top) / rect.height;
        camX = fxp * worldPxW() - viewW() / 2 / camZoom;
        camY = fyp * worldPxH() - viewH() / 2 / camZoom;
        requestRender();
    };
    mm.addEventListener('mousedown', e => { lookAt(e); const mv = ev => lookAt(ev); window.addEventListener('mousemove', mv); window.addEventListener('mouseup', () => window.removeEventListener('mousemove', mv), { once: true }); });

    // Drag a .json in to open it
    area.addEventListener('dragover', e => { e.preventDefault(); area.classList.add('dropping'); });
    area.addEventListener('dragleave', () => area.classList.remove('dropping'));
    area.addEventListener('drop', e => {
        e.preventDefault();
        area.classList.remove('dropping');
        const f = e.dataTransfer.files && e.dataTransfer.files[0];
        if (f) readWorldFile(f);
    });
    document.getElementById('file-input').addEventListener('change', e => { const f = e.target.files[0]; if (f) readWorldFile(f); e.target.value = ''; });
}

function onDown(e) {
    const area = document.getElementById('canvas-area');
    if (e.button === 1 || (e.button === 0 && (spaceDown || e.altKey))) {
        e.preventDefault();
        panning = { x: e.clientX, y: e.clientY, cx: camX, cy: camY };
        area.classList.add('panning');
        return;
    }
    const h = eventHex(e);
    if (!h) return;
    const erase = e.button === 2;

    // Right-click on terrain picks
    if (activeLayer === 'terrain' && (erase || activeTool === 'pick')) { selectTerrain(getTile(h.q, h.r)); return; }

    if (activeLayer === 'realms' && realmMode === 'capital') {
        if (erase) return;
        checkpoint();
        seatCapital(h.q, h.r);
        return;
    }

    if (activeLayer === 'places' && !erase && !LINEAR[selectedPlace]) {
        // A click on an existing place of another kind selects it instead of replacing it
        const o = overlays[key(h.q, h.r)];
        if (o && o.type !== selectedPlace && selectedPlace !== 'start') { selectedHex = h; updateSelectedInfo(); requestFx(); return; }
        checkpoint();
        placeAt(h.q, h.r);
        afterChange(true);
        return;
    }

    checkpoint();
    if (activeTool === 'fill' && activeLayer !== 'places') { fillAt(h.q, h.r, erase); afterChange(true); return; }
    if (activeTool === 'rect' || activeTool === 'line') { dragStart = h; dragCur = h; stroke = { erase }; requestFx(); return; }
    stroke = { erase, last: h };
    paintCells(strokeCells(h), erase);
}
function strokeCells(h) {
    if (activeLayer === 'places') return withMirrors([h]);
    return brushCells(h.q, h.r, brushRadius);
}
function onMove(e) {
    if (panning) {
        camX = panning.cx - (e.clientX - panning.x) / camZoom;
        camY = panning.cy - (e.clientY - panning.y) / camZoom;
        requestRender();
        return;
    }
    if (e.target !== fxCanvas && !stroke && !dragStart) return;
    const h = eventHex(e);
    hover = h;
    showHover(h);
    if (dragStart && h) { dragCur = h; requestFx(); return; }
    if (stroke && h && stroke.last && (h.q !== stroke.last.q || h.r !== stroke.last.r)) {
        // Fill the gap a fast drag leaves between two samples
        const path = WT.line(stroke.last.q, stroke.last.r, h.q, h.r).slice(1).filter(c => inBounds(c.q, c.r));
        const cells = [];
        for (const c of path) cells.push(...strokeCells(c));
        paintCells(cells, stroke.erase);
        stroke.last = h;
    }
    requestFx();
}
function onUp() {
    if (panning) { panning = null; document.getElementById('canvas-area').classList.remove('panning'); return; }
    if (dragStart && dragCur) {
        paintCells(shapeCells(dragStart, dragCur), stroke && stroke.erase);
        dragStart = dragCur = null;
        afterChange(true);
    } else if (stroke) {
        afterChange(activeLayer !== 'terrain');
    }
    stroke = null;
}

function showHover(h) {
    if (!h) return;
    const t = TERRAIN_TYPES[getTile(h.q, h.r)];
    document.getElementById('st-coord').textContent = `${h.q}, ${h.r}`;
    document.getElementById('st-terrain').textContent = t ? t.name : '—';
    const k = key(h.q, h.r), bits = [];
    const o = overlays[k];
    if (o) bits.push(`${PLACE_TYPES[o.type].icon} ${o.name || PLACE_TYPES[o.type].name}`);
    if (roadOverlays[k]) bits.push(roadOverlays[k].type === 'trade_road' ? 'trade road' : 'road');
    if (rivers[k]) bits.push('river');
    const rm = territory[k] && realmById(territory[k]);
    if (rm) bits.push(rm.name);
    document.getElementById('st-extra').textContent = bits.join(' · ');
}

function onKey(e) {
    const tag = e.target.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || document.querySelector('.eui-modal')) return;
    const k = e.key.toLowerCase();
    if ((e.ctrlKey || e.metaKey) && k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
    if ((e.ctrlKey || e.metaKey) && k === 'y') { e.preventDefault(); redo(); return; }
    if ((e.ctrlKey || e.metaKey) && k === 's') { e.preventDefault(); exportJson(); return; }
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.code === 'Space') { e.preventDefault(); spaceDown = true; document.getElementById('canvas-area').classList.add('space'); return; }
    const tools = { b: 'paint', g: 'fill', r: 'rect', l: 'line', i: 'pick', e: 'raise', d: 'lower', s: 'smooth' };
    if (tools[k]) { setTool(tools[k]); return; }
    if (k === '[') { setBrush(brushRadius); return; }
    if (k === ']') { setBrush(brushRadius + 2); return; }
    if (k === '1') return setLayer('terrain');
    if (k === '2') return setLayer('places');
    if (k === '3') return setLayer('realms');
    if (k === 'h') return toggleView('grid');
    if (k === 'w') return toggleView('wrap');
    if (k === '0' || e.key === 'Home') return fitCanvas();
    if (e.key === '+' || e.key === '=') return zoomCanvas(1);
    if (e.key === '-') return zoomCanvas(-1);
    if (e.key === '?') return showHelp();
    if ((e.key === 'Delete' || e.key === 'Backspace') && selectedHex) return removeOverlayAtSelected();
    const pan = { arrowleft: [-1, 0], arrowright: [1, 0], arrowup: [0, -1], arrowdown: [0, 1] }[k];
    if (pan) { e.preventDefault(); camX += pan[0] * 120 / camZoom; camY += pan[1] * 120 / camZoom; requestRender(); }
}

function toggleView(which) {
    view[which] = !view[which];
    document.getElementById('btn-' + which).classList.toggle('active', view[which]);
    requestRender();
}
function toggleMenu(id) { document.getElementById(id).classList.toggle('open'); }
function closeMenus() { document.querySelectorAll('.menu.open').forEach(m => m.classList.remove('open')); }
function toggleSec(h) { h.parentElement.classList.toggle('collapsed'); }
function toast(msg, type) { EditorUI.toast(msg, { type, duration: 1600 }); }

function showHelp() {
    const rows = [
        ['B G R L I', 'Brush · Fill · Rectangle · Line · Pick'],
        ['E D S', 'Raise · Lower · Smooth (terrain)'],
        ['[ ]', 'Smaller · larger brush'],
        ['1 2 3', 'Terrain · Places · Realms'],
        ['Right-click', 'Pick terrain · erase places · clear lands'],
        ['Space / middle-drag', 'Pan (Alt-drag too)'],
        ['Wheel · + − · 0', 'Zoom · fit'],
        ['Arrows', 'Pan'],
        ['H · W', 'Grid · show the east-west wrap'],
        ['Ctrl+Z · Ctrl+Y', 'Undo · redo'],
        ['Ctrl+S', 'Export .json'],
        ['Delete', 'Remove the selected place'],
    ];
    EditorUI.modal({
        title: 'World editor shortcuts',
        bodyHTML: `<div class="help-grid">${rows.map(([a, b]) => `<kbd>${a}</kbd><span>${b}</span>`).join('')}</div>` +
            `<p class="pal-note" style="margin-top:12px">The game's world wraps east to west — turn on 🔁 to paint across the seam. Your work autosaves in this browser.</p>`,
        actions: [{ label: 'Close', primary: true }],
    });
}

// ═══════════════════════════════════════════════════════════════
//  SELECTION, CHECK, STATS
// ═══════════════════════════════════════════════════════════════
function updateSelectedInfo() {
    const sec = document.getElementById('sec-selected');
    const o = selectedHex && overlays[key(selectedHex.q, selectedHex.r)];
    if (!o) { sec.style.display = 'none'; return; }
    const pt = PLACE_TYPES[o.type];
    sec.style.display = '';
    document.getElementById('sel-type').textContent = `${pt.icon} ${pt.name}`;
    document.getElementById('sel-at').textContent = `${selectedHex.q}, ${selectedHex.r} · ${TERRAIN_TYPES[getTile(selectedHex.q, selectedHex.r)].name}`;
    const nameEl = document.getElementById('sel-name');
    if (document.activeElement !== nameEl) nameEl.value = o.name || '';
}
let renameCheckpointed = null;
function renameSelected(v) {
    const o = selectedHex && overlays[key(selectedHex.q, selectedHex.r)];
    if (!o) return;
    if (renameCheckpointed !== o) { checkpoint(); renameCheckpointed = o; }
    o.name = v.trim();
    requestRender();
    markDirty();
}
function removeOverlayAtSelected() {
    if (!selectedHex) return;
    const k = key(selectedHex.q, selectedHex.r);
    if (!overlays[k]) return;
    checkpoint();
    delete overlays[k];
    selectedHex = null;
    afterChange(true);
}
const NAME_A = ['Ash','Black','Bright','Cold','Crow','Dun','East','Elder','Fair','Fern','Gold','Grey','Hart','High','Iron','King','Long','Mill','Oak','Raven','Red','Rose','Salt','Silver','Stone','Storm','Thorn','West','White','Wolf','Wind'];
const NAME_B = ['bridge','brook','burgh','by','cliff','combe','crest','dale','ford','gate','hall','haven','holm','hollow','keep','marsh','mere','minster','moor','mouth','reach','ridge','stead','stow','thorpe','ton','vale','wall','watch','well','wick','wood'];
function makeName() {
    return NAME_A[Math.floor(Math.random() * NAME_A.length)] + NAME_B[Math.floor(Math.random() * NAME_B.length)];
}
function randomName() {
    if (!selectedHex || !overlays[key(selectedHex.q, selectedHex.r)]) return;
    const n = makeName();
    document.getElementById('sel-name').value = n;
    renameSelected(n);
}

function runCheck() {
    const issues = WT.validate(getExportData());
    const el = document.getElementById('issues');
    const errs = issues.filter(i => i.level === 'error').length, warns = issues.filter(i => i.level === 'warn').length;
    const badge = document.getElementById('check-badge');
    badge.textContent = errs ? `${errs} error${errs > 1 ? 's' : ''}` : warns ? `${warns} warning${warns > 1 ? 's' : ''}` : '✓ ready';
    badge.className = 'badge' + (errs ? ' err' : warns ? ' warn' : '');
    const icon = { error: '⛔', warn: '⚠', info: 'ℹ' };
    el.innerHTML = issues.length
        ? issues.slice(0, 30).map((i, n) => `<div class="issue ${i.level}${i.q != null ? ' jump' : ''}" data-n="${n}"><i>${icon[i.level]}</i><span>${esc(i.msg)}</span></div>`).join('')
        : '<div class="issue info"><i>✓</i><span>Nothing to fix — this map is ready to play.</span></div>';
    el.querySelectorAll('.issue.jump').forEach(d => d.onclick = () => { const i = issues[+d.dataset.n]; centerOn(i.q, i.r); });
}

function updateStats() {
    const counts = {};
    for (const t of tiles) counts[t] = (counts[t] || 0) + 1;
    const total = tiles.length;
    const land = tiles.filter(WT.isLand).length;
    const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);
    let html = `<div><b style="color:var(--text)">${mapW} × ${mapH}</b> · ${total.toLocaleString()} hexes · ${Math.round(land / total * 100)}% land</div>`;
    html += `<div class="bar">${sorted.map(([id, n]) => `<span title="${TERRAIN_TYPES[id].name}" style="width:${n / total * 100}%;background:${TERRAIN_TYPES[id].color}"></span>`).join('')}</div>`;
    for (const [id, n] of sorted.slice(0, 8)) html += `<div style="display:flex;gap:5px;align-items:center"><span style="width:8px;height:8px;border-radius:2px;background:${TERRAIN_TYPES[id].color}"></span>${TERRAIN_TYPES[id].name}<span style="margin-left:auto">${Math.round(n / total * 1000) / 10}%</span></div>`;
    const placeCounts = {};
    for (const o of Object.values(overlays)) placeCounts[o.type] = (placeCounts[o.type] || 0) + 1;
    const extra = [
        ...Object.entries(placeCounts).map(([t, n]) => `${PLACE_TYPES[t].icon} ${n} ${PLACE_TYPES[t].name.toLowerCase()}${n > 1 ? 's' : ''}`),
        Object.keys(roadOverlays).length ? `🛤️ ${Object.keys(roadOverlays).length} road hexes` : '',
        Object.keys(rivers).length ? `💧 ${Object.keys(rivers).length} river hexes` : '',
        `👑 ${realms.filter(r => r.capital).length} realms seated`,
    ].filter(Boolean);
    html += `<div style="margin-top:6px;border-top:1px solid var(--border);padding-top:5px;line-height:1.6">${extra.join('<br>')}</div>`;
    document.getElementById('stats-content').innerHTML = html;
}

// ═══════════════════════════════════════════════════════════════
//  EXPORT / IMPORT (getExportData / loadWorldData are called by the parent)
// ═══════════════════════════════════════════════════════════════
function getExportData() {
    const placed = {};
    for (const [k, o] of Object.entries(overlays)) placed[k] = o.name ? { type: o.type, name: o.name } : { type: o.type };
    const any = obj => Object.keys(obj).length ? obj : undefined;
    return {
        name: document.getElementById('world-name').value,
        author: document.getElementById('world-author').value,
        seed: parseInt(document.getElementById('world-seed').value, 10) || 0,
        width: mapW,
        height: mapH,
        tiles: tiles.slice(),
        overlays: any(placed),
        roadOverlays: any({ ...roadOverlays }),
        rivers: any({ ...rivers }),
        realms: realms.map(r => ({ ...r, capital: r.capital ? { ...r.capital } : null })),
        territory: any({ ...territory }),
        playerStart: playerStart ? { ...playerStart } : null,
        rules: {
            kingdomCount: clampInt(document.getElementById('rule-kingdoms').value, 1, 15, 6),
            independentSettlements: document.getElementById('rule-villages').value,
            ruinsFreq: document.getElementById('rule-ruins').value,
            autoRoads: document.getElementById('rule-roads').checked,
            realmTowns: document.getElementById('rule-towns').checked,
        },
    };
}

function loadWorldData(data, opts = {}) {
    if (!data) return;
    const set = (id, v) => { if (v != null) document.getElementById(id).value = v; };
    set('world-name', data.name);
    set('world-author', data.author);
    set('world-seed', data.seed);
    if (data.width && data.height && Array.isArray(data.tiles) && data.tiles.length === data.width * data.height) {
        mapW = data.width; mapH = data.height;
        tiles = data.tiles.map(t => TERRAIN_TYPES[t] ? t : 'ocean');
    }
    document.getElementById('map-w').value = mapW;
    document.getElementById('map-h').value = mapH;
    overlays = {}; roadOverlays = {};
    const take = (src) => {
        for (const [k, o] of Object.entries(src || {})) {
            if (!o || !PLACE_TYPES[o.type]) continue;
            // Older worlds kept roads among the places and stored default names
            if (o.type === 'road' || o.type === 'trade_road') { roadOverlays[k] = { type: o.type }; continue; }
            let name = typeof o.name === 'string' ? o.name.trim() : '';
            if (['undefined', 'null'].includes(name.toLowerCase()) || name === PLACE_TYPES[o.type].name) name = '';
            overlays[k] = { type: o.type, name };
        }
    };
    take(data.overlays);
    take(data.roadOverlays);
    rivers = { ...(data.rivers || {}) };
    territory = { ...(data.territory || {}) };
    realms = Array.isArray(data.realms) && data.realms.length
        ? data.realms.map(r => ({ ...r, capital: r.capital ? { q: r.capital.q, r: r.capital.r } : null }))
        : DEFAULT_REALMS.map(r => ({ ...r, capital: null }));
    selectedRealm = realms[0] ? realms[0].id : null;
    playerStart = data.playerStart || null;
    selectedHex = null;
    const rules = data.rules || {};
    if (rules.kingdomCount) document.getElementById('rule-kingdoms').value = rules.kingdomCount;
    if (rules.independentSettlements) document.getElementById('rule-villages').value = rules.independentSettlements;
    if (rules.ruinsFreq) document.getElementById('rule-ruins').value = rules.ruinsFreq;
    document.getElementById('rule-roads').checked = rules.autoRoads !== false;
    document.getElementById('rule-towns').checked = rules.realmTowns !== false;
    if (!opts.keepHistory) { undoStack.clear(); updateUndoButtons(); }
    fitCanvas();
    afterChange(true);
}

function download(name, blob) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function fileStem() { return EditorCore.slugify(document.getElementById('world-name').value || 'world') || 'world'; }
function exportJson() {
    closeMenus();
    download(fileStem() + '.world.json', new Blob([JSON.stringify(getExportData())], { type: 'application/json' }));
    toast('Exported ' + fileStem() + '.world.json');
}
function importJson() { closeMenus(); document.getElementById('file-input').click(); }
function readWorldFile(file) {
    const fr = new FileReader();
    fr.onload = () => {
        try {
            const data = JSON.parse(fr.result);
            if (typeof data.tiles === 'string') data.tiles = WT.unrle(data.tiles);
            if (!data.width || !data.height || !Array.isArray(data.tiles)) throw new Error('not a world file');
            checkpoint();
            loadWorldData(data, { keepHistory: true });
            toast('Opened ' + file.name);
        } catch (err) {
            EditorUI.toast('Could not open ' + file.name + ': ' + err.message, { type: 'error' });
        }
    };
    fr.readAsText(file);
}
// The whole map as a picture, tile art and all (wide maps scale down to fit 6000px)
function exportPng() {
    closeMenus();
    const zoom = Math.min(1.5, 6000 / worldPxW(), 6000 / worldPxH());
    const w = Math.ceil(worldPxW() * zoom), h = Math.ceil(worldPxH() * zoom);
    const cv = document.createElement('canvas');
    cv.width = w; cv.height = h;
    const keepLayer = activeLayer;
    activeLayer = '';
    drawWorld(cv.getContext('2d'), { x: 0, y: 0, zoom, w, h, dpr: 1 }, { full: true });
    activeLayer = keepLayer;
    cv.toBlob(b => { download(fileStem() + '.png', b); toast('Picture exported'); }, 'image/png');
}

// Parent communication
window.addEventListener('message', ev => {
    if (!ev.data) return;
    if (ev.data.type === 'loadWorld') { checkpoint(); loadWorldData(ev.data.world, { keepHistory: true }); }
    // The parent is about to playtest: come back to this map afterwards
    if (ev.data.type === 'beforePlaytest') { autosave(); try { sessionStorage.setItem(RESUME_KEY, '1'); } catch (e) { /* storage off */ } }
});
window.getExportData = getExportData;
window.loadWorldData = loadWorldData;
window.prepareForPlaytest = () => { autosave(); try { sessionStorage.setItem(RESUME_KEY, '1'); } catch (e) { /* storage off */ } return getExportData(); };

init();
try { window.parent.postMessage({ type: 'worldEditorReady' }, '*'); } catch (e) { /* no parent */ }
</script>
